name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only needs to read this repository. Keep the default token constrained even
# if a later action is added to this workflow.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check org-lease scripts are executable
        run: |
          test -x bin/sf-org-resolve
          test -x bin/sf-lease
          test -x claude/hooks/sf-lease-guard.sh
          test -x claude/hooks/sf-lease-post.sh
          test -x claude/hooks/sf-lease-end.sh
          test -x claude/hooks/sf-lease-table.sh
          test -x scripts/test-sf-org-resolve.sh
          test -x scripts/test-sf-lease.sh
          test -x scripts/test-sf-lease-hooks.sh

      - name: Check every shell script
        run: bash scripts/check-shell.sh

      - name: Lint shell scripts
        run: bash scripts/check-shell.sh --lint

      - name: Check executable scripts
        run: |
          test -x install-macos.sh
          test -x uninstall-macos.sh
          test -x tmux/tmux-llm-status
          test -x scripts/check-background-inbox.sh
          test -x scripts/test-check-background-inbox.sh
          test -x scripts/list-background-inbox.sh
          test -x scripts/test-list-background-inbox.sh
          test -x scripts/background-bundles.sh
          test -x scripts/check-manifest-paths.sh
          test -x scripts/test-check-manifest-paths.sh
          test -x scripts/check-background-assets.sh
          test -x scripts/publish-backgrounds.sh
          test -x scripts/test-publish-backgrounds.sh
          test -x scripts/fetch-backgrounds.sh
          test -x scripts/test-fetch-backgrounds.sh
          test -x scripts/test-backgrounds-lua.sh
          test -x scripts/test-links-lua.sh
          test -x scripts/test-nvim.sh
          test -x scripts/test-tmux-llm-status.sh
          test -x claude/statusline.sh
          test -x claude/hooks/tmux-agent-depth.sh
          test -x scripts/test-tmux-agent-depth.sh
          test -x scripts/test-statusline.sh

      - name: Check ignored macOS metadata
        run: |
          ! find . -name .DS_Store -print | grep .

      - name: Check background inbox workflow
        run: ./scripts/test-check-background-inbox.sh

      - name: Check manifest paths
        run: ./scripts/check-manifest-paths.sh

      - name: Run script test suites
        run: |
          bash scripts/test-check-shell.sh
          bash scripts/test-install-macos.sh
          bash scripts/test-codex-restore.sh
          bash scripts/test-tmux-agent-resume.sh
          ./scripts/test-import-background-inbox.sh
          ./scripts/test-check-manifest-paths.sh
          ./scripts/test-publish-backgrounds.sh
          ./scripts/test-fetch-backgrounds.sh
          ./scripts/test-list-background-inbox.sh
          ./scripts/test-tmux-agent-depth.sh
          ./scripts/test-statusline.sh

      - name: Install tmux (for tmux-llm-status behavioural tests)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run tmux-llm-status tests
        run: |
          ./scripts/test-tmux-llm-status.sh
          bash scripts/test-tmux-platform.sh

      - name: Install Neovim (current stable, for config headless-load test)
        run: |
          curl -fsSL -o /tmp/nvim.tar.gz \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz
          sudo tar -C /opt -xzf /tmp/nvim.tar.gz
          echo "/opt/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install tree-sitter CLI (nvim-treesitter main compiles parsers with it)
        run: |
          curl -fsSL -o /tmp/tree-sitter.gz \
            https://github.com/tree-sitter/tree-sitter/releases/latest/download/tree-sitter-linux-x64.gz
          gunzip /tmp/tree-sitter.gz
          sudo install -m 0755 /tmp/tree-sitter /usr/local/bin/tree-sitter

      - name: Check Neovim harness failure propagation
        run: bash scripts/test-test-nvim.sh

      - name: Neovim config loads clean
        run: ./scripts/test-nvim.sh

      - name: Install Lua (for WezTerm module unit tests)
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Run WezTerm module unit tests
        run: |
          ./scripts/test-backgrounds-lua.sh
          ./scripts/test-links-lua.sh

  dashboard:
    name: Dashboard verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dashboard test tooling
        run: npm ci

      - name: Verify budget helper
        run: node --test ../scripts/test-codex-budget.mjs

      - name: Verify generated assets, syntax, and unit tests
        run: npm run verify

      - name: Install Chromium for browser regression tests
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:browser

  macos-leases:
    name: macOS lease regression tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install hook test dependency
        run: brew install jq
      - name: Run lease suites
        run: |
          bash scripts/test-sf-org-resolve.sh
          bash scripts/test-sf-lease.sh
          bash scripts/test-sf-lease-liveness.sh
          bash scripts/test-sf-lease-process.sh
          bash scripts/test-sf-lease-hooks.sh
