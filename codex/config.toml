# Start routine sessions on the everyday workhorse. Use codex-role build,
# architect, or research when the task requires a pinned Sol configuration.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

# Auto: work freely inside the active repository and route eligible boundary
# approvals through Codex's reviewer instead of interrupting the session.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[projects."/Users/jasonalvarez/gitHubRepos"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/autopulse"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/chart-the-course"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/swing-sync"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/dotfiles"]
trust_level = "trusted"

[tui]
status_line = ["project-name", "context-used", "five-hour-limit", "weekly-limit", "model-with-reasoning"]
status_line_use_colors = true

[tui.model_availability_nux]
"gpt-5.5" = 4

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"

[mcp_servers.notion.tools.notion-update-page]
approval_mode = "approve"

[notice]
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.4" = "gpt-5.6-terra"

[agents]
# Delegation improves elapsed time and context isolation, but every spawned
# agent consumes its own tokens. Keep the default pool intentionally small and
# reserve explicit Sol role pins for work whose risk requires them.
enabled = true
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

# Per-session objective, shared with Claude Code and rendered on the tmux status
# bar (Codex's tui.status_line takes fixed identifiers, so it cannot show this).
# Invoked by name, not via $HOME: Codex does not document whether hook commands
# go through a shell, and a PATH lookup works either way. Requires ~/.local/bin
# on PATH, which codex-role and tmux-llm-status already assume.
[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = 'session-objective capture --codex'
timeout = 5

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = 'session-objective reset'
timeout = 5
