# Routine delivery uses Sol/medium. Explicit profiles select heavier research
# or architecture work; mechanical tasks may select Luna at session start.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

# Auto: work freely inside the active repository and route eligible boundary
# approvals through Codex's reviewer instead of interrupting the session.
sandbox_mode = "workspace-write"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[projects."/Users/jasonalvarez/gitHubRepos"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/autopulse"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/chart-the-course"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/swing-sync"]
trust_level = "trusted"

[projects."/Users/jasonalvarez/gitHubRepos/dotfiles"]
trust_level = "trusted"

[tui]
status_line = ["project-name", "context-used", "five-hour-limit", "weekly-limit", "model-with-reasoning"]
status_line_use_colors = true
screen_reader_detection_done = true

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-6.1-sol" = 4

[notice]
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.4" = "gpt-6.1-sol"

[features]
# Keep context explicit: repository instructions and task prompts, not recall
# extracted from earlier chats.
memories = false

[agents]
# A primary session owns each outcome. A single, explicit subagent is permitted
# only for a bounded question that materially benefits from context isolation.
# Each subagent consumes allowance independently.
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
