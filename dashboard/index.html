<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#07111f">
    <link rel="icon" href="data:,">
    <title>Night Pass Session Map</title>
    <meta name="description" content="An opt-in local visual progress map for LLM sessions.">
    <link rel="stylesheet" href="./generated/route-motion.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <a class="skip-link" href="#pit-lane">Skip to pit lane</a>
    <div id="dashboard-root" class="dashboard-root" data-track-id="ridge-pass">
      <header class="dashboard-bar">
        <div class="brand">
          <h1>Night Pass Session Map</h1>
          <p id="source-label" class="mode-pill">Fixtures · Night sector</p>
        </div>
        <div class="bar-course">
          <label for="track-select">Course</label>
          <select id="track-select">
            <option value="auto">Auto · workday schedule</option>
            <option value="ridge-pass">Ridge Pass</option>
            <option value="cypress-run">Cypress Run</option>
            <option value="harbor-yard-rallycross">Harbor Yard Rallycross</option>
          </select>
          <span id="track-status" class="track-status">Active course: Ridge Pass</span>
          <span id="track-live-region" class="visually-hidden" aria-live="polite"></span>
        </div>
        <p id="snapshot-summary" class="snapshot-summary">Preparing the route…</p>
        <div id="on-track-summary" class="on-track-summary" aria-label="Route session summary"></div>
        <details class="legend-disclosure">
          <summary aria-label="Session state legend">?</summary>
          <ul class="state-legend" aria-label="Session state legend">
            <li class="legend-active"><span aria-hidden="true">›</span> Active</li>
            <li class="legend-thinking"><span aria-hidden="true">…</span> Thinking</li>
            <li class="legend-waiting"><span aria-hidden="true">!</span> Permission</li>
            <li class="legend-idle"><span aria-hidden="true">‖</span> Idle</li>
            <li class="legend-error"><span aria-hidden="true">×</span> Error</li>
            <li class="legend-complete"><span aria-hidden="true">✓</span> Complete</li>
            <li class="legend-unknown"><span aria-hidden="true">?</span> Unknown</li>
          </ul>
        </details>
        <section id="source-controls" class="source-controls" aria-label="Snapshot source">
          <label class="import-label" for="snapshot-file">Import</label>
          <input id="snapshot-file" type="file" accept=".json,application/json">
          <button id="reset-source" type="button">Fixtures</button>
          <button id="go-live" type="button" disabled>Go live</button>
          <span id="source-age" class="source-age"></span>
          <span id="source-notice" class="source-notice" role="status"></span>
        </section>
      </header>

      <main id="map-stage" class="map-stage" aria-labelledby="map-heading">
        <h2 id="map-heading" class="map-heading">Ridge Pass</h2>
        <svg class="route-map" viewBox="0 0 1000 760" preserveAspectRatio="none"
          aria-hidden="true" focusable="false">
          <defs>
                <pattern id="contour-dashes" width="80" height="48" patternUnits="userSpaceOnUse">
                  <path d="M-8 34 Q20 14 46 32 T96 26" fill="none" stroke="currentColor" stroke-width="1" opacity=".22" />
                </pattern>
                <pattern id="checkpoint-hatch" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
                  <rect width="6" height="16" fill="currentColor" opacity=".12" />
                </pattern>
                <filter id="road-glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="8" result="blur" />
                  <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>
              </defs>

              <rect class="map-night" width="1000" height="760" rx="28" />
              <rect class="contour-field" width="1000" height="760" rx="28" />
              <g id="ridge-pass-art" class="course-art" data-track-art="ridge-pass">
              <g transform="translate(1000 0) scale(-1 1)">
              <path class="ridge-shadow" d="M0 238 Q180 195 340 225 T650 168 T1000 84 V0 H0Z" />
              <path class="valley-line" d="M10 610 Q164 565 315 607 T592 606 T985 522" />
              <g class="terrain-contours">
                <path d="M650 74 Q782 35 978 60" />
                <path d="M626 102 Q790 58 986 91" />
                <path d="M18 584 Q160 543 302 577 T585 574" />
                <path d="M14 626 Q158 590 300 624 T570 621" />
              </g>
              <g class="cliff-boundary">
                <path d="M820 340 Q715 368 637 343" />
                <path d="M799 337l9 22m-43-15 8 25m-46-16 7 26m-47-21 5 27m-48-30 2 26" />
              </g>
              <g class="forest-boundary">
                <path d="M310 414 Q431 376 538 416" />
                <path d="M245 520 Q361 478 472 518" />
                <path d="M18 672 Q153 630 275 672" />
              </g>
              <g class="tree-line">
                <path d="M322 374l14 30h-10l13 25h-40l13-25h-9z" />
                <path d="M274 448l17 36h-11l15 28h-42l15-28h-11z" />
                <path d="M196 523l15 32h-10l14 27h-38l14-27h-10z" />
                <path d="M98 595l18 38h-12l16 30H76l16-30H80z" />
                <path d="M823 518l15 32h-10l14 27h-38l14-27h-10z" />
              </g>
              <g class="retaining-wall">
                <path d="M573 365 Q655 348 743 355" />
                <path d="M590 359v18m31-23v18m31-22v18m31-17v18m31-12v18" />
                <path d="M404 570 Q493 583 578 567" />
                <path d="M423 568v18m34-14v18m35-16v18m35-19v18m34-23v18" />
              </g>

              </g>
              <path id="ridge-pass-centerline" fill="none" />
              <g class="route-bed" filter="url(#road-glow)">
                <use class="road-shoulder" href="#ridge-pass-centerline" />
                <use class="road-surface" href="#ridge-pass-centerline" />
              </g>
              <g class="route-centerlines">
                <path class="segment-high-moor" data-route-segment-index="0" />
                <path class="segment-pass-ladder" data-route-segment-index="1" />
                <path class="segment-cedar-chain" data-route-segment-index="2" />
                <path class="segment-cloud-ridge" data-route-segment-index="3" />
                <path class="segment-long-arc" data-route-segment-index="4" />
                <path class="segment-valley-gate" data-route-segment-index="5" />
              </g>
              <g class="segment-labels">
                <text class="label-high-moor" x="142" y="50">HIGH MOOR</text>
                <text class="label-pass-ladder" x="116" y="246">PASS LADDER</text>
                <text class="label-cedar-chain" x="626" y="358">CEDAR CHAIN</text>
                <text class="label-cloud-ridge" x="568" y="558">CLOUD RIDGE</text>
                <text class="label-long-arc" x="350" y="674">LONG ARC</text>
                <text class="label-valley-gate" x="900" y="688">VALLEY GATE</text>
              </g>
              </g>

              <g id="harbor-yard-rallycross-art" class="course-art harbor-yard-rallycross-art" data-track-art="harbor-yard-rallycross">
                <rect class="harbor-apron" x="22" y="22" width="956" height="716" rx="42" />
                <path class="harbor-water" d="M0 0H1000V102 C900 132 820 94 700 122 C550 156 420 94 260 128 C150 152 72 118 0 150Z" />
                <path class="harbor-water" d="M0 760V684 C120 650 210 704 330 674 C480 636 620 704 760 670 C860 646 935 680 1000 654V760Z" />
                <g class="harbor-quay">
                  <path d="M48 132H952 M48 658H952 M90 90V184 M910 90V184 M90 576V704 M910 576V704" />
                </g>
                <g class="harbor-containers">
                  <rect x="92" y="266" width="130" height="48" rx="5" /><rect x="110" y="324" width="130" height="48" rx="5" />
                  <rect x="726" y="146" width="138" height="48" rx="5" /><rect x="748" y="204" width="138" height="48" rx="5" />
                  <rect x="720" y="564" width="142" height="48" rx="5" /><rect x="744" y="620" width="142" height="48" rx="5" />
                </g>
                <g class="harbor-cranes">
                  <path d="M258 88V164H384 M690 88V160H826 M282 594V690H412 M620 590V692H754" />
                  <path d="M340 164v34 M772 160v34 M370 690v-34 M706 692v-36" />
                </g>
                <g class="harbor-gravel">
                  <path d="M510 160 C590 190 630 250 632 316 C634 386 604 446 554 504" />
                  <path d="M210 494 C260 560 350 612 454 630 C560 648 660 624 722 568" />
                </g>
                <path class="harbor-jump" d="M658 603l48-22 48 22-48 22z" />
                <g class="harbor-beacons">
                  <circle cx="74" cy="212" r="8" /><circle cx="286" cy="120" r="8" /><circle cx="900" cy="286" r="8" />
                  <circle cx="894" cy="500" r="8" /><circle cx="628" cy="684" r="8" /><circle cx="162" cy="604" r="8" />
                </g>
                <path id="harbor-yard-rallycross-centerline" fill="none" />
                <g class="route-bed" filter="url(#road-glow)">
                  <use class="road-shoulder" href="#harbor-yard-rallycross-centerline" />
                  <use class="road-surface" href="#harbor-yard-rallycross-centerline" />
                </g>
                <g class="route-centerlines harbor-route-centerlines">
                  <path class="segment-dock-start" data-route-segment-index="0" />
                  <path class="segment-crane-sweep" data-route-segment-index="1" />
                  <path class="segment-gravel-cut" data-route-segment-index="2" />
                  <path class="segment-basin-loop" data-route-segment-index="3" />
                  <path class="segment-crossover-rise" data-route-segment-index="4" />
                  <path class="segment-yard-finish" data-route-segment-index="5" />
                </g>
                <g class="segment-labels">
                  <text class="label-dock-start" x="258" y="98">DOCK START</text>
                  <text class="label-crane-sweep" x="770" y="282">CRANE SWEEP</text>
                  <text class="label-gravel-cut" x="520" y="302">GRAVEL CUT</text>
                  <text class="label-basin-loop" x="330" y="482">BASIN LOOP</text>
                  <text class="label-crossover-rise" x="708" y="652">CROSSOVER RISE</text>
                  <text class="label-yard-finish" x="540" y="720">YARD FINISH</text>
                </g>
              </g>

              <g id="cypress-run-art" class="course-art cypress-run-art" data-track-art="cypress-run">
                <rect class="drift-paved-apron" x="22" y="22" width="956" height="716" rx="42" />
                <path class="drift-service-grid"
                  d="M54 54H402 M602 54H946 M54 706H402 M602 706H946 M104 42V120 M144 42V120 M184 42V120 M824 626V716 M864 626V716 M904 626V716" />
                <g class="drift-floodlight-pools">
                  <ellipse cx="174" cy="132" rx="150" ry="104" />
                  <ellipse cx="842" cy="330" rx="142" ry="132" />
                  <ellipse cx="530" cy="510" rx="148" ry="150" />
                  <ellipse cx="812" cy="660" rx="170" ry="94" />
                  <ellipse cx="140" cy="552" rx="120" ry="154" />
                </g>
                <g class="drift-lane-islands drift-ninety-boxes">
                  <path d="M118 148H486V222H418V190H118z" />
                  <path d="M610 322H810L842 344L810 366H610z" />
                  <path d="M520 478H760V570H700V518H520z" />
                  <path d="M208 556H398V624H334V590H208z" />
                </g>
                <g class="drift-skid-arcs drift-apex-rings">
                  <path d="M846 246 C928 242 966 292 958 354 C952 410 914 448 846 450" />
                  <path d="M850 270 C916 268 940 304 936 350 C932 394 904 424 848 426" />
                  <path d="M892 612 C966 630 978 692 928 734 C884 766 816 738 770 728" />
                  <path d="M894 638 C942 650 950 692 914 714 C880 734 824 714 778 706" />
                  <path d="M146 724 C74 716 42 676 48 618 C52 570 44 520 54 482" />
                  <path d="M150 704 C98 696 74 664 76 620 C78 574 70 526 78 500" />
                </g>
                <g class="drift-tire-barriers">
                  <path d="M566 116v82 M900 298v94 M486 492v94 M92 530v86" />
                  <path d="M240 142h108 M664 292h106 M590 662h102 M220 682h106" />
                </g>
                <g class="drift-cones">
                  <path d="M126 118l8-18 8 18z M166 120l8-18 8 18z M206 120l8-18 8 18z" />
                  <path d="M516 148l8-18 8 18z M578 250l8-18 8 18z M900 382l8-18 8 18z M440 470l8-18 8 18z" />
                  <path d="M496 616l8-18 8 18z M876 690l8-18 8 18z M92 604l8-18 8 18z M128 462l8-18 8 18z" />
                </g>
                <g class="drift-clip-markers">
                  <path d="M516 102h30v16h-30z M548 246h30v16h-30z M904 332h30v16h-30z M824 414h30v16h-30z" />
                  <path d="M442 462h30v16h-30z M472 612h30v16h-30z M884 696h30v16h-30z M64 588h30v16h-30z" />
                </g>
                <path id="cypress-run-centerline" fill="none" />
                <g class="route-bed" filter="url(#road-glow)">
                  <use class="road-shoulder" href="#cypress-run-centerline" />
                  <use class="road-surface" href="#cypress-run-centerline" />
                </g>
                <g class="route-centerlines drift-route-centerlines">
                  <path class="segment-launch-line" data-route-segment-index="0" />
                  <path class="segment-north-nineties" data-route-segment-index="1" />
                  <path class="segment-east-hairpin" data-route-segment-index="2" />
                  <path class="segment-drop-chute" data-route-segment-index="3" />
                  <path class="segment-south-hairpin" data-route-segment-index="4" />
                  <path class="segment-west-switchback" data-route-segment-index="5" />
                </g>
                <g class="segment-labels">
                  <text class="label-launch-line" x="210" y="66">LAUNCH LINE</text>
                  <text class="label-north-nineties" x="696" y="246">NORTH NINETIES</text>
                  <text class="label-east-hairpin" x="842" y="394">EAST HAIRPIN</text>
                  <text class="label-drop-chute" x="510" y="552">DROP CHUTE</text>
                  <text class="label-south-hairpin" x="714" y="680">SOUTH HAIRPIN</text>
                  <text class="label-west-switchback" x="146" y="480">WEST SWITCHBACK</text>
                </g>
              </g>

            </svg>

        <div id="vehicle-layer" class="vehicle-layer" aria-label="Sessions positioned on the route"></div>
        <div id="tooltip-layer" class="tooltip-layer"></div>
        <div id="overflow-notice" class="overflow-notice" hidden></div>
      </main>

      <section id="pit-lane" class="pit-lane" aria-label="Pit lane" tabindex="-1">
        <section class="pit" aria-labelledby="pit-heading">
          <header><span aria-hidden="true">&#9670;</span><h2 id="pit-heading">Pit</h2></header>
          <div id="pit" class="pit-bays" aria-label="Parked sessions grouped by tmux session"></div>
          <div id="pit-overflow" class="pit-overflow" hidden></div>
        </section>
      </section>
    </div>
    <noscript>
      <p class="noscript-message">This local dashboard needs JavaScript to render its fixture snapshot.</p>
    </noscript>
    <script>window.__LIVE_TOKEN__ = "%%LIVE_TOKEN%%";</script>
    <script type="module" src="./src/app.mjs"></script>
  </body>
</html>
